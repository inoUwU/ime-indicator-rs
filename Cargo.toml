[package]
name = "ime-indicator-rs"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
anyhow = "1.0.100"
ctrlc = "3.4"
env_logger = "0.11.8"
gpui = "0.2.2"
gpui-component = "0.5.0"
log = "0.4.29"
serde = { version = "1.0.228", features = ["derive"] }
toml = "0.9.11"
tray-icon = "0.21.2"
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Iis",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_Ime",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging"
] }

[dependencies.windows-strings]
version = "0.5"

[build-dependencies]
winres = "0.1.12"

[profile.release]
opt-level = 3
debug = false
lto = "fat"
