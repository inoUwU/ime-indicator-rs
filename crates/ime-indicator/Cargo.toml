[package]
name = "ime-indicator"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[[bin]]
name = "ime-indicator"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
ctrlc = "3.4"
env_logger = "0.11.8"
log = "0.4.29"
shared = { path = "../shared" }
tray-icon = "0.21.2"
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Iis",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_Ime",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging"
] }

[dependencies.windows-strings]
version = "0.5"

[build-dependencies]
winres = "0.1.12"
